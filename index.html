<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Bank</title>
<style>
:root{--bg:#F4F6F8;--s:#fff;--ink:#0E1B2C;--mut:#4A5868;--line:#DDE3E9;--ac:#0F5C54;--aci:#fff;--bad:#9A3412}
@media(prefers-color-scheme:dark){:root{--bg:#0A121C;--s:#121D2B;--ink:#EDF1F5;--mut:#A9B5C2;--line:#26364A;--ac:#4FC1B1;--aci:#06201C;--bad:#FDBA74}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:960px;margin:0 auto;padding:24px 20px 64px}
.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:22px}.narrow{max-width:420px;margin:48px auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px}
h1,h2{margin:0 0 8px}label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
input{width:100%;height:46px;padding:0 12px;border:1px solid var(--mut);border-radius:8px;font:inherit;background:var(--s);color:var(--ink)}
button{height:46px;padding:0 20px;border:0;border-radius:8px;background:var(--ac);color:var(--aci);font:600 15px inherit;cursor:pointer;margin-top:14px}
button.link{background:none;color:var(--ac);padding:0;display:block}button.alt{background:none;border:1px solid var(--ink);color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.bar button{margin:0}
.big{font-size:clamp(34px,6vw,52px);font-weight:700;letter-spacing:-.02em}.mut{color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.err{color:var(--bad);font-weight:500}.ok{color:var(--ac);font-weight:500}
</style></head>
<body><div id="app"><p class="mut">Loading…</p></div><script src="more.js"></script><script src="app.js"></script></body></html>
